<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Trade AI · 登录</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" type="module"></script>
</head>
<body>
  <main class="page-shell">
    <section id="auth-panel" class="auth-panel" aria-labelledby="auth-title">
      <header class="brand-row">
        <span class="brand-mark" aria-hidden="true">📦</span>
        <span class="brand-name">Trade AI</span>
      </header>
      <div class="auth-content">
        <p class="eyebrow">外贸业务流程复刻版</p>
        <h1 id="auth-title">欢迎回来</h1>
        <p id="auth-subtitle" class="subtitle">登录以进入你的公司空间</p>
        <div class="mode-switch" role="tablist" aria-label="账户操作">
          <button id="show-login" class="mode-button is-active" type="button" role="tab" aria-selected="true">登录</button>
          <button id="show-register" class="mode-button" type="button" role="tab" aria-selected="false">注册</button>
        </div>
        <form id="login-form" class="auth-form">
          <label for="login-email">邮箱</label>
          <input id="login-email" name="email" type="email" autocomplete="email" maxlength="254" required>
          <label for="login-password">密码</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
          <button class="primary-button" type="submit">登录</button>
        </form>
        <form id="register-form" class="auth-form" hidden>
          <label for="register-email">邮箱</label>
          <input id="register-email" name="email" type="email" autocomplete="email" maxlength="254" required>
          <label for="register-password">密码</label>
          <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          <button class="primary-button" type="submit">创建账户</button>
        </form>
        <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
      </div>
      <footer class="auth-footer">原项目业务流程 · 无试用激活限制</footer>
    </section>
  </main>
</body>
</html>
